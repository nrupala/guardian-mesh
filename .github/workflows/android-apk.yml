name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "webui/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: webui

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: webui/package-lock.json

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # change from 17 to 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the legacy "tools"
          # package, which Google removed from the SDK repository — the
          # install fails with "Failed to find package 'tools'". Install
          # only what the Capacitor 8 project needs (compileSdk 36).
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - run: npm ci
      - run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-mesh-apk
          path: webui/android/app/build/outputs/apk/debug/*.apk
