syntax = "proto3";

package guardian_mesh;

// ──────────────────────────────────────────
//  Guardian Mesh — gRPC Service Definitions
//  Spec: GUARDIAN_MESH_FORMAL_SPEC.md
// ──────────────────────────────────────────

// ── Core Service ──────────────────────────

service GuardianMesh {
  // Evaluate an action through the Guardian Mesh
  // Pipeline: Sentinel → Gatekeeper → Witness → Arbiter → Vault
  rpc Evaluate (EvaluateRequest) returns (EvaluateResponse);

  // Verify a cryptographically sealed audit proof
  rpc VerifyProof (VerifyProofRequest) returns (VerifyProofResponse);

  // Health check (must be available before Evaluate)
  rpc Health (HealthRequest) returns (HealthResponse);

  // Open a handshake session for subsequent Evaluate calls.
  // Returns the session ID and its HMAC key. The session key is a
  // bearer credential: hold it over an authenticated, encrypted
  // channel only (the daemon is designed to sit behind one).
  rpc Handshake (HandshakeRequest) returns (HandshakeResponse);

  // Read the audit trail and verify its hash chain integrity.
  // Returns entries in append order plus chain verification status.
  rpc ReadAuditLog (ReadAuditLogRequest) returns (ReadAuditLogResponse);

  // Issue a release-evidence certificate (WO-6 / GMSI-1).
  // Binds a gate verdict to an evidence pack under the daemon's signature.
  rpc IssueCertificate (IssueCertificateRequest) returns (IssueCertificateResponse);

  // Revoke a certificate by serial.
  rpc RevokeCertificate (RevokeCertificateRequest) returns (RevokeCertificateResponse);

  // Query the lifecycle status of a certificate by serial.
  rpc CertificateStatus (CertificateStatusRequest) returns (CertificateStatusResponse);
}

// ── Message Types ─────────────────────────

// Sealed envelope with CRC32C integrity + ML-DSA-65 signature
message SealedEnvelope {
  bytes payload = 1;          // CBOR-encoded inner message
  bytes payload_type = 2;     // Type hint for deserialization
  uint32 crc32c = 3;          // CRC32C digest of payload
  bytes ml_dsa_65_signature = 4; // ML-DSA-65 signature over crc32c || payload
  uint64 timestamp = 5;       // Unix nanos — sender's wall clock
  bytes nonce = 16;            // 32-byte random nonce
}

// Protocol Firewall request wrapper (PF-1 validation step)
message FirewalledRequest {
  SealedEnvelope envelope = 1;
  string source_enclave = 2;    // Originating enclave identifier
  string handshake_session = 3; // Handshake Bus session ID
  bytes hmac_tag = 4;          // HMAC-SHA256 over envelope bytes
}

// ── Evaluate RPC ──────────────────────────

message EvaluateRequest {
  FirewalledRequest firewalled = 1;
  ActionDescriptor action = 2;
}

message ActionDescriptor {
  string action_type = 1;  // TOOL_CALL, CODE_EXECUTE, NETWORK_REQUEST, etc.
  string context = 2;
  string target = 3;
  map<string, string> metadata = 16;
}

message EvaluateResponse {
  string verdict = 1;       // ALLOW, BLOCK, THROTTLE, ESCALATE
  string reason = 2;
  string containment_stage = 3; // NORMAL..TERMINATE
  AuditProof proof = 4;
  bytes handshake_token = 5; // Next session token
  // The AuditProof above, sealed with the daemon's signing key
  // (payload is the encoded AuditProof). Present it to VerifyProof
  // to re-check the proof independently of this response.
  SealedEnvelope proof_envelope = 6;
}

// ── VerifyProof RPC ───────────────────────

message VerifyProofRequest {
  SealedEnvelope proof_envelope = 1;
}

message VerifyProofResponse {
  bool valid = 1;
  string reason = 2;
  AuditProof proof = 3;
}

// ── Health RPC ────────────────────────────

message HealthRequest {}

// ── Handshake RPC ─────────────────────────

message HandshakeRequest {
  string source_enclave = 1; // Caller identifier, e.g. "webui"
  // The caller's ML-DSA-65 verifying key (1952 bytes), bound to the
  // session this handshake opens. Every Evaluate envelope on the
  // session must carry a signature that verifies against this key;
  // anything else is denied. (Field 2 is unused.)
  bytes source_public_key = 3;
}

message HandshakeResponse {
  string session_id = 1;
  bytes session_key = 2;   // HMAC-SHA256 key for this session
  uint64 ttl_seconds = 3;  // Session lifetime from creation
}

message HealthResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    DEGRADED = 3;
  }
  ServingStatus status = 1;
  map<string, string> enclave_health = 2;
  uint32 protocol_firewall_rules_passed = 3;
  uint32 protocol_firewall_rules_total = 4;
  string signing_key_fingerprint = 5; // SHA-256 of the daemon's ML-DSA-65 public key (lowercase hex)
}

// ── Shared Types ──────────────────────────

message AuditProof {
  string action_id = 1;
  string verdict = 2;
  string enclave_chain = 3;    // Sentinel→Gatekeeper→Witness→Arbiter
  bytes signature = 4;         // Witness-signed digest
  uint64 timestamp = 5;
  bytes merkle_root = 16;      // Optional — for batch audit verification
}

// ── ReadAuditLog RPC ──────────────────────

message ReadAuditLogRequest {}

message ReadAuditLogResponse {
  repeated AuditLogEntry entries = 1;
  ChainVerificationStatus verification = 2;
}

message AuditLogEntry {
  uint64 sequence = 1;       // Position in the log (0-indexed)
  uint64 timestamp = 2;      // Unix seconds
  string action_id = 3;      // Hex-encoded action type
  string verdict = 4;        // ALLOW, BLOCK, etc.
  string enclave_chain = 5;  // Full chain as stored
  string chain_hash = 6;     // The stored chain hash for this entry
  string reason = 7;         // Verdict reason/detail
}

message ChainVerificationStatus {
  bool verified = 1;         // true if the chain is intact
  uint64 entries_checked = 2; // How many entries were verified
  uint64 first_break_position = 3; // If not verified, position of first break (0-indexed); 0 if verified
  string status_message = 4; // Human-readable status
}

// ── Certificate RPCs (WO-6) ───────────────

message IssueCertificateRequest {
  string product = 1;              // Product name
  string version = 2;              // Product version
  string verdict = 3;              // Gate verdict (PASS, PASS WITH FINDINGS, BLOCKED)
  bytes evidence = 4;              // Evidence pack bytes (raw document, not sealed)
  string evidence_hash = 5;        // Claimed SHA-256 hex of evidence (lowercase)
  string evidence_scope = 6;       // "working-tree" or "full-history"
  TestCounts tests = 7;            // Test counts
  string policy = 8;               // Gate version string
}

message TestCounts {
  uint32 passed = 1;
  uint32 failed = 2;
  uint32 total = 3;
}

message IssueCertificateResponse {
  bool issued = 1;                 // true if certificate was issued; false if refused
  string serial = 2;               // Certificate serial (if issued)
  string fingerprint = 3;          // SHA-256 fingerprint of the payload (if issued)
  SealedEnvelope certificate = 4;  // The sealed certificate envelope (if issued)
  string refusal_reason = 5;       // Reason for refusal (if not issued)
}

message RevokeCertificateRequest {
  string serial = 1;
  string reason = 2;
}

message RevokeCertificateResponse {
  bool revoked = 1;
  string message = 2;
}

message CertificateStatusRequest {
  string serial = 1;
}

message CertificateStatusResponse {
  enum Status {
    UNKNOWN = 0;
    ACTIVE = 1;
    SUPERSEDED = 2;
    REVOKED = 3;
  }
  Status status = 1;
  CertificateBody body = 2;  // Stored body fields (if known)
}

message CertificateBody {
  string schema = 1;
  uint32 schema_version = 2;
  string serial = 3;
  string issuer = 4;
  string product = 5;
  string version = 6;
  string verdict = 7;
  string evidence_hash = 8;
  string evidence_scope = 9;
  TestCounts tests = 10;
  string policy = 11;
  string pf_outcomes = 12;         // null in v1 (reserved for GMSI-7)
  uint64 issued_at = 13;
  string supersedes = 14;          // serial or empty string (null)
  string fingerprint = 15;
}
