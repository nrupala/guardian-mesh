[package]
name = "guardian-meshd"
version = "0.1.6"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.102"
blake3 = "1.8.5"
chacha20poly1305 = "0.10.1"
crc32c = "0.6.8"
getrandom = "0.4.2"
ml-kem = "0.3.2"
hex = "0.4.3"
hmac = "0.13.0"
ml-dsa = "0.1.0"
prost = "0.14.3"
rand = "0.10.1"
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tonic = { version = "0.14.5", features = ["channel", "codegen", "router", "server", "transport"] }
tonic-prost = "0.14.5"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
prost-build = "0.14.3"
tonic-build = "0.14.5"
tonic-prost-build = "0.14.5"
